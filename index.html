<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⋆.˚✿🌷fairy worlds🌷✿˚.⋆</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-34EW956ZHJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag("js", new Date());
      gtag("config", "G-34EW956ZHJ");
    </script>
  </head>
  <body>
    <button id="object-mode-toggle" class="object-mode-toggle" aria-pressed="false" title="toggle physics object mode">
      ✦ object mode: off ✦
    </button>

    <div id="world-hud" class="hud-panel" hidden>
      <div class="hud-line">click canvas to look · WASD or scroll to move · shift = fast · ctrl = slow</div>
      <button id="btn-home" class="home-btn" aria-label="home">✿</button>
      <button id="btn-recenter" class="recenter-btn" aria-label="return to spawn" title="return to spawn">⊙</button>
      <div id="variant-pills-desktop" class="variant-pills" hidden></div>
      <button id="btn-spawn-box" class="hud-btn" hidden>✦ drop object ✦</button>
      <div id="box-hint" class="hud-line" hidden>right-drag: slide · alt+right-drag: lift</div>
    </div>

    <button id="prev-world-edge" class="circle-btn edge-arrow edge-arrow-left" aria-label="previous world" title="previous world" hidden>‹</button>
    <button id="next-world-edge" class="circle-btn edge-arrow edge-arrow-right" aria-label="next world" title="next world" hidden>›</button>

    <div id="portal-nav-bar" hidden>
      <button id="prev-world-bar" class="circle-btn" aria-label="previous world" title="previous world">‹</button>
      <div id="variant-pills-mobile" class="variant-pills"></div>
      <button id="next-world-bar" class="circle-btn" aria-label="next world" title="next world">›</button>
    </div>

    <div id="home-hud" class="hud-panel" hidden>
      <div class="hud-line hud-heading" hidden>✿ fairy worlds ✿</div>
      <button id="btn-change-character" class="hud-btn">♡ pick a character ♡</button>
    </div>

    <div id="companion" hidden>
      <div id="companion-bubble" class="companion-bubble" hidden></div>
      <button id="btn-recenter-mobile" class="recenter-btn recenter-btn-mobile" aria-label="return to spawn" title="return to spawn">⊙</button>
      <canvas id="companion-canvas"></canvas>
    </div>

    <div id="character-picker" class="picker-modal" hidden>
      <div class="picker-backdrop"></div>
      <div class="picker-card">
        <button id="picker-close" class="picker-close" aria-label="close">✕</button>
        <div class="picker-heading">✧ ✶⋆.˚⋆˚꩜｡ ݁⋆ ꫂ᭪ ݁˖ . ݁♡ </div>
        <div id="picker-gallery" class="picker-gallery"></div>
        <div id="picker-customization" class="picker-customization"></div>
      </div>
    </div>

    <div id="scenes-header">
      <span class="scenes-header-flourish">✿⋆˚</span>
      <span class="scenes-header-label">select a world</span>
      <span class="scenes-header-flourish">˚⋆✿</span>
    </div>
    <nav id="scenes"></nav>

    <div id="loader" hidden>
      <div id="sparkle-field"></div>
      <div class="loader-card">
        <div class="loader-heading">♡ loading ♡</div>
        <div class="loader-title">…</div>
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
        <div class="loader-pct">0%</div>
      </div>
    </div>

    <div id="transition-overlay" hidden>
      <div id="transition-sparkle-field"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
